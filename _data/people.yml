faculty:
  - first: 'Alark'
    last : 'Joshi'
    image: 'joshi.png'
    about: |
      Alark Joshi is a Professor of Computer Science at the University of San Francisco. His research focuses on data visualization, with an emphasis on mobile data visualization and visualization literacy, including techniques that provide context on small screens and Bloom's taxonomy-based approaches to teaching unfamiliar visualization types such as treemaps and parallel coordinates plots. More broadly, he develops and evaluates novel visualization techniques that communicate information for effective decision making, with applications in computational fluid dynamics, atmospheric physics, medical imaging, cell biology, and neurosurgical planning. Alark received his Ph.D. in Computer Science from UMBC, an M.S. from the University of Minnesota Duluth, and a B.E. in Computer Engineering from PICT, India, and was a Postdoctoral Associate at Yale University, where he was a core member of the BioImage Suite team.
