      Sophie Engle is a Professor of Computer Science at the University of San Francisco. Sophie's research interests include computer science education and data visualization. Sophie received a Ph.D. in Computer Science from the University of California, Davis, working with Matt Bishop and Sean Peisert in the Computer Security Laboratory, and a B.S. in Computer Science from the University of Nebraska at Omaha, studying networking and computer security at the Peter Kiewit Institute.
